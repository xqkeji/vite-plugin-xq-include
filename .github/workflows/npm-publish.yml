# Auto-publish to npm via OIDC Trusted Publishing when a version tag (v*) is pushed.
#
# No NPM_TOKEN secret needed: npm authenticates with the GitHub OIDC token
# (granted by `id-token: write` below). Configure the trusted publisher on
# npmjs.com -> Packages -> <pkg> -> Settings -> Trusted publishing:
#   Owner: xqkeji   Repository: vite-plugin-xq-include   Workflow filename: npm-publish.yml
name: Node.js Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # Required for npm OIDC trusted publishing

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # Node 24 bundles npm 11.5+ which supports OIDC
          registry-url: https://registry.npmjs.org/
      - run: npm install
      - run: npm run build
      - run: npm publish --access public
