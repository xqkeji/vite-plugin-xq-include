# Auto-publish to npm when a version tag (v*) is pushed.
#
# 2FA fix: the NPM_TOKEN repository secret MUST be an npm *automation* token,
# created on the 2FA-enabled npm account with:
#     npm token create --type=automation
# Automation tokens bypass the OTP prompt, so `npm publish` runs fully unattended.
# A regular auth token will still fail with ERR! code EOTP under 2FA.
name: Node.js Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm install
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
